<!doctype html>
<!--
  The holding page for rankverso.com (decision 30, 2026-10-08): the name and
  "Coming soon", nothing else, until the marketing site (docs/design/site-brief.md)
  replaces it. Self-contained on purpose: no fonts, scripts, images or analytics
  from anywhere else, so loading it tells no third party anything ("never sold",
  decision 21). Kept out of search engines until the site launches. Deployed as
  its own Vercel project with this folder as the root (runbook section 10).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Verso</title>
    <!--
      Rafa's mark (decision 31), served from this folder like the page itself:
      the SVG for browsers that take one, in the dark colors in a dark browser;
      the PNG at 32 for the rest. Both are written by
      apps/mobile/scripts/brand-assets.mjs from docs/design/assets/brand/verso-mark.svg.
    -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --muted: #6e6e73;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #f5f5f7;
          --muted: #98989f;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        padding: 0 16px;
      }
      h1 {
        margin: 0;
        font-size: clamp(40px, 10vw, 72px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 12px 0 0;
        font-size: 17px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Verso</h1>
      <p>Coming soon.</p>
    </main>
  </body>
</html>
