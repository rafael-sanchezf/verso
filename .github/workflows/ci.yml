name: CI

# The one check that runs on every code push: the generated theme, the
# typecheck and the unit tests, about two minutes on a runner. It is the only
# job that has ever caught a real break here (2026-10-08: three PRs green on
# their own disagreed on SteamImportResult once merged in bulk), which is why
# it runs on main as well as on PRs. The web export, the site build, the Deno
# tests and the pgTAP suite never failed in 463 runs, so they moved to
# weekly-check.yml (Rafa, 2026-10-14, VER-229): the app has no users yet, and
# the Actions plan is 3,000 minutes a month.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  # A second push to the same branch makes the first run's answer moot, so it
  # is cancelled rather than billed to the end.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The theme the app styles from is generated from packages/tokens/tokens.json
      # and committed, so nothing here has a build step. That only holds if the
      # committed outputs match the token file: regenerate and fail on a diff.
      - name: Check the generated theme is in step with tokens.json
        run: pnpm tokens:check

      - run: pnpm typecheck
      - run: pnpm test
